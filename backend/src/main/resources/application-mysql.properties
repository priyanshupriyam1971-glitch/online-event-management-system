# MySQL profile — activate with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/event_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=change-this-into-a-long-random-secret-key-for-production-use-only-0123456789abcdef
app.jwt.expiration-ms=28800000

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
