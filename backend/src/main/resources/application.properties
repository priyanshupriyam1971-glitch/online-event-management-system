server.port=8080

# Default profile uses the H2 in-memory database so the app runs with zero setup.
# To use MySQL instead: --spring.profiles.active=mysql (see application-mysql.properties)
spring.datasource.url=jdbc:h2:mem:eventdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

# Serialize dates as ISO strings (e.g. 2026-12-01T18:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT settings
app.jwt.secret=change-this-into-a-long-random-secret-key-for-production-use-only-0123456789abcdef
app.jwt.expiration-ms=28800000

# Allowed frontend origins (React dev server)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
